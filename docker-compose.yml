services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dia-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MSSQL_PID: Express
    volumes:
      - dia-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    # Not published to the host on purpose; the API reaches it on the internal network.
    # Uncomment to connect with SSMS/Azure Data Studio from your machine:
    # ports:
    #   - "1433:1433"

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-dia_db}
    entrypoint: >
      /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -C
      -Q \"IF DB_ID('$$DB_NAME') IS NULL CREATE DATABASE [$$DB_NAME]\""
    restart: "no"

  api:
    build: ./backend
    container_name: dia-api
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SERVER: db
      DB_PORT: 1433
      DB_NAME: ${DB_NAME:-dia_db}
      DB_ENCRYPT: "false"
      DB_TRUST_CERT: "true"
    ports:
      - "${API_PORT:-5000}:5000"
    restart: unless-stopped

volumes:
  dia-mssql-data:
